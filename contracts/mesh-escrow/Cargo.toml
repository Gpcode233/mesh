[package]
name = "mesh-escrow"
version = "0.1.0"
edition = "2021"
description = "Mesh procurement escrow: owner-funded orders, milestone payouts under an operator mandate, freeze and revoke."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Keep arithmetic checks in the shipped contract: money math must never wrap.
overflow-checks = true
